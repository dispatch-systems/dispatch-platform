name: Isolated BrowserOS
description: Install the pinned browser with the host isolation used by native verification.
outputs:
  package-hit:
    description: Whether the pinned package came from the cache instead of a download.
    value: ${{ steps.package.outputs.cache-hit }}
runs:
  using: composite
  steps:
    # Only main's cache workflow saves the package, so a PR never stores its own copy.
    - name: Restore the pinned browser package
      id: package
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/dispatch-browseros/browseros.deb
        key: dispatch-browseros-${{ hashFiles('ops/launchers/browseros-release.json') }}
    - name: Download the pinned browser package
      if: steps.package.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/.cache/dispatch-browseros
        url=$(python3 -c "import json; print(json.load(open('ops/launchers/browseros-release.json'))['url'])")
        curl --fail --location --silent --show-error --retry 3 --output ~/.cache/dispatch-browseros/browseros.deb "$url"
    # Packages the runner image has stay as they are: upgrading them only downloads from a
    # mirror that can stall for minutes. A stalled download is dropped and tried again.
    - shell: bash
      run: |
        printf '%s\n' 'APT::Get::Upgrade "false";' 'Acquire::Retries "3";' \
          'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' |
          sudo tee /etc/apt/apt.conf.d/90-dispatch-ci > /dev/null
        sudo apt-get update -qq
        sudo apt-get install -y bubblewrap xvfb libxtst6 libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2t64 libgbm1
        sudo install -d -m 755 /usr/local/libexec/dispatch-dev
        sudo install -m 755 /usr/bin/bwrap /usr/local/libexec/dispatch-dev/bwrap
        if command -v apparmor_parser >/dev/null; then
          sudo apparmor_parser -r ops/scripts/dispatch-dev-bwrap.apparmor
        fi
        sudo install -d -o root -g root -m 755 /opt
        # The installer verifies the pinned checksum and size of its own copy, cached or not.
        sudo python3 ops/launchers/install-browseros.py --archive ~/.cache/dispatch-browseros/browseros.deb
