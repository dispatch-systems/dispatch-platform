name: Node and packages
description: >-
  The Node `.node-version` pins and the workspace's packages: node_modules restored whole when
  main's caches workflow saved one for this lockfile, `npm ci` otherwise.
inputs:
  install:
    description: Also install the workspace's packages.
    default: 'true'
  save:
    description: Save node_modules after a fresh install. Only main's caches workflow does.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version-file: .node-version
    # Installed with --ignore-scripts, the packages are the lockfile's files and nothing else, so
    # a copy keyed by the lockfile and the Node version is what `npm ci` would write. The manifest
    # is in the key too, as `npm ci` refuses one the lockfile, platform or engines don't match and
    # a restored copy would hide that: all of it but its scripts and version, which no install
    # reads, so a new script doesn't make every job install again.
    - name: Identify the installed packages
      id: inputs
      if: inputs.install == 'true'
      shell: bash
      run: |
        set -o pipefail
        manifest=$(jq -cS 'del(.scripts, .version)' package.json)
        key=$({ sha256sum .node-version package-lock.json; printf '%s' "$manifest" | sha256sum; } |
          sha256sum | cut -d' ' -f1)
        echo "key=$key" >> "$GITHUB_OUTPUT"
    - name: Restore the installed packages
      id: modules
      if: inputs.install == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: node_modules
        key: dispatch-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.key }}
    - name: Install the packages
      if: inputs.install == 'true' && steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --ignore-scripts
    - name: Save the installed packages
      if: inputs.install == 'true' && inputs.save == 'true' && steps.modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: node_modules
        key: ${{ steps.modules.outputs.cache-primary-key }}
