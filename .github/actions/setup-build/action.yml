name: Build tools and Rust cache
description: Pinned tools with separate release/debug caches, which only main refreshes.
inputs:
  profile:
    description: Cache partition, release or debug.
    required: true
  save:
    description: Allow this job to maintain the cache on main.
    default: 'true'
  binaries:
    description: >-
      Restore the debug backend and support worker that main built from the same Rust inputs,
      in place of Cargo's dependency cache: for a job whose only Rust build is theirs. Release
      builds always do.
    default: 'false'
  dependencies:
    description: >-
      Restore Cargo's dependency cache even when the exact binaries were restored: for a job that
      compiles more besides.
    default: 'false'
  reuse-binary:
    description: Restore the exact binaries instead of compiling them.
    default: 'true'
  pull-request-lto:
    description: >-
      On a pull request, compile a release build without main's exact binaries with link-time
      optimisation, as main and releases do. 'false' compiles it without, from the dependency
      cache main's caches workflow keeps for that: for a job whose release build is only tested.
    default: 'true'
outputs:
  binary-key:
    description: Exact Rust input key for the profile's backend and support worker.
    value: ${{ steps.binary-key.outputs.key }}
  binary-hit:
    description: Whether the exact binaries were restored.
    value: ${{ steps.binary-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-packages
    - uses: ./.github/actions/setup-rust
    - name: Identify reusable binaries
      id: binary-key
      if: inputs.profile == 'release' || inputs.binaries == 'true'
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
      run: |
        if [ "$PROFILE" = release ]; then
          tooling/cli/dispatchdev build --release --cache-key >> "$GITHUB_OUTPUT"
        else
          tooling/cli/dispatchdev build --cache-key >> "$GITHUB_OUTPUT"
        fi
        echo "DISPATCH_CI_RUST_CACHE=$GITHUB_WORKSPACE/.ci-rust-cache" >> "$GITHUB_ENV"
    - name: Bind the selected Rust inputs
      if: steps.binary-key.outputs.key != ''
      shell: bash
      env:
        BINARY_KEY: ${{ steps.binary-key.outputs.key }}
      run: echo "DISPATCH_CI_RUST_KEY=$BINARY_KEY" >> "$GITHUB_ENV"
    - name: Restore exact binaries
      id: binary-cache
      if: steps.binary-key.outputs.key != '' && inputs.reuse-binary == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .ci-rust-cache/
        key: dispatch-rust-binary-${{ inputs.profile }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.binary-key.outputs.key }}
    # Thin LTO optimises the backend across every crate as one, the longest part of its compile
    # by far. A PR's build only feeds its own tests, which main's run of the merged commit
    # repeats on the optimised build Dev installs, so it compiles without, from the dependency
    # cache built the same way: LTO changes how every dependency compiles. The binaries' key
    # reads the setting, so they are never taken for main's.
    - name: Compile a pull request's release build without LTO
      id: no-lto
      if: >-
        inputs.profile == 'release' && inputs.pull-request-lto == 'false' &&
        github.event_name == 'pull_request' && steps.binary-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        export CARGO_PROFILE_RELEASE_LTO=false
        echo "CARGO_PROFILE_RELEASE_LTO=false" >> "$GITHUB_ENV"
        set -o pipefail
        key=$(tooling/cli/dispatchdev build --release --cache-key | sed -n 's/^key=//p')
        # No key: the inputs can't use the binary cache, and Cargo builds them as it is.
        if [ -n "$key" ]; then
          echo "DISPATCH_CI_RUST_KEY=$key" >> "$GITHUB_ENV"
        fi
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      if: steps.binary-cache.outputs.cache-hit != 'true' || inputs.dependencies == 'true'
      with:
        prefix-key: ${{ env.DISPATCH_RUST_CACHE }}
        shared-key: dispatch-${{ steps.no-lto.outcome == 'success' && 'nolto' || inputs.profile }}
        cache-bin: 'false'
        save-if: ${{ inputs.save == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
