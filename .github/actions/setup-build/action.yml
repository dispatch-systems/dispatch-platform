name: Build tools and Rust cache
description: Pinned tools with separate release/debug caches, which only main refreshes.
inputs:
  profile:
    description: Cache partition, release or debug.
    required: true
  save:
    description: Allow this job to maintain the cache on main.
    default: 'true'
  binaries:
    description: >-
      Restore the debug backend and support worker that main built from the same Rust inputs,
      in place of Cargo's dependency cache: for a job whose only Rust build is theirs. Release
      builds always do.
    default: 'false'
  dependencies:
    description: >-
      Restore Cargo's dependency cache even when the exact binaries were restored: for a job that
      compiles more besides.
    default: 'false'
  reuse-binary:
    description: Restore the exact binaries instead of compiling them.
    default: 'true'
outputs:
  binary-key:
    description: Exact Rust input key for the profile's backend and support worker.
    value: ${{ steps.binary-key.outputs.key }}
  binary-hit:
    description: Whether the exact binaries were restored.
    value: ${{ steps.binary-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-packages
    - run: rustup show active-toolchain
      shell: bash
    - name: Identify reusable binaries
      id: binary-key
      if: inputs.profile == 'release' || inputs.binaries == 'true'
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
      run: |
        if [ "$PROFILE" = release ]; then
          tooling/cli/dispatchdev build --release --cache-key >> "$GITHUB_OUTPUT"
        else
          tooling/cli/dispatchdev build --cache-key >> "$GITHUB_OUTPUT"
        fi
        echo "DISPATCH_CI_RUST_CACHE=$GITHUB_WORKSPACE/.ci-rust-cache" >> "$GITHUB_ENV"
    - name: Bind the selected Rust inputs
      if: steps.binary-key.outputs.key != ''
      shell: bash
      env:
        BINARY_KEY: ${{ steps.binary-key.outputs.key }}
      run: echo "DISPATCH_CI_RUST_KEY=$BINARY_KEY" >> "$GITHUB_ENV"
    - name: Restore exact binaries
      id: binary-cache
      if: steps.binary-key.outputs.key != '' && inputs.reuse-binary == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .ci-rust-cache/
        key: dispatch-rust-binary-${{ inputs.profile }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.binary-key.outputs.key }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      if: steps.binary-cache.outputs.cache-hit != 'true' || inputs.dependencies == 'true'
      with:
        prefix-key: ${{ env.DISPATCH_RUST_CACHE }}
        shared-key: dispatch-${{ inputs.profile }}
        cache-bin: 'false'
        save-if: ${{ inputs.save == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
