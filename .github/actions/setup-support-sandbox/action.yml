name: Support execution sandbox
description: Install Bubblewrap and verify its isolated namespace support.
runs:
  using: composite
  steps:
    - name: Install the support execution sandbox
      shell: bash
      run: |
        # Compare the runner's network access with APT's privilege-separated downloader.
        for account in runner root _apt; do
          echo "Network diagnostics: $account"
          sudo -u "$account" sh -c '
            id
            ls -ld /etc/resolv.conf /run/systemd/resolve 2>/dev/null || true
            for name in http_proxy https_proxy HTTP_PROXY HTTPS_PROXY; do
              if printenv "$name" >/dev/null; then echo "$name is set"; fi
            done
            timeout 10 getent ahostsv4 archive.ubuntu.com || true
            timeout 10 curl --head --silent --show-error --max-time 8 https://archive.ubuntu.com/ubuntu/dists/noble/InRelease || true
          '
        done
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends apparmor bubblewrap
        # Allow namespaces for Bubblewrap while retaining its mount/network isolation.
        sudo apparmor_parser -r <<'PROFILE'
        abi <abi/4.0>,
        include <tunables/global>
        profile bwrap /usr/bin/bwrap flags=(unconfined) {
          userns,
        }
        PROFILE
        bwrap --unshare-all --ro-bind / / -- /usr/bin/true
