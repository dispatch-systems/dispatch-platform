name: sccache
description: >-
  Puts the pinned sccache on PATH, which tooling/build/rustc-remap.py then compiles through, with
  its local cache restored as one entry for the job named: main's newest, which only main saves.
inputs:
  job:
    description: The job whose cache this is.
    required: true
runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b
      with:
        tool: sccache@0.19.0
    - name: Point sccache at its cache
      shell: bash
      run: |
        echo "SCCACHE_DIR=$HOME/.cache/sccache" >> "$GITHUB_ENV"
        # sccache drops its least recently used past this, so main's entry stays a fixed size.
        echo "SCCACHE_CACHE_SIZE=1G" >> "$GITHUB_ENV"
    - name: Restore sccache's cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/sccache
        key: dispatch-sccache-${{ inputs.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
        restore-keys: dispatch-sccache-${{ inputs.job }}-${{ runner.os }}-${{ runner.arch }}-
