name: Prebuilt CI tools
description: >-
  Restore dispatchdev, dispatch-host and the browser assessment fixture built from identical
  inputs by the tools job of this run or of main. Nothing is compiled here; launchers build
  with Cargo when a tool is absent.
inputs:
  fixture:
    description: Also restore the assessment fixture the browser suite uses.
    default: 'false'
outputs:
  tools-key:
    description: Cache key of the CI and host tools.
    value: ${{ steps.keys.outputs.tools }}
  tools-hit:
    description: Whether the tools were restored.
    value: ${{ steps.tools.outputs.cache-hit }}
  fixture-key:
    description: Cache key of the assessment fixture.
    value: ${{ steps.keys.outputs.fixture }}
  fixture-hit:
    description: Whether the fixture was restored.
    value: ${{ steps.fixture.outputs.cache-hit }}
  playwright-key:
    description: Cache key of the Playwright browser, which follows the Playwright version.
    value: ${{ steps.keys.outputs.playwright }}
runs:
  using: composite
  steps:
    - name: Identify the tool inputs
      id: keys
      shell: bash
      # The pinned toolchain file and the distribution identify the compiler and system
      # libraries. The weekly image build is left out: GitHub runs two of them while it
      # rolls one out, and keying on it made about half the jobs miss and compile again.
      # The host embeds its Python launchers, and the compiler wrapper shapes every binary, so
      # they are inputs too.
      run: |
        image="${{ runner.os }}-${{ runner.arch }}-${ImageOS:-unknown}"
        echo "tools=dispatch-tools-$image-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'tooling/cli/**', 'tooling/shared/**', 'ops/host-manager/**', 'ops/launchers/*.py', 'tooling/build/*.py') }}" >> "$GITHUB_OUTPUT"
        echo "fixture=dispatch-fixture-$image-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'app/**', 'core/**', 'collectors/**', 'features/**', 'mcp/**', 'ops/host-manager/Cargo.toml', 'tooling/cli/Cargo.toml', 'tooling/shared/Cargo.toml', 'ops/launchers/*.py', 'tooling/build/*.py') }}" >> "$GITHUB_OUTPUT"
        playwright=$(jq -er '.packages["node_modules/playwright-core"].version' package-lock.json)
        echo "playwright=dispatch-playwright-${{ runner.os }}-${{ runner.arch }}-$playwright" >> "$GITHUB_OUTPUT"
        echo "DISPATCH_CI_TOOLS=$GITHUB_WORKSPACE/.ci-tools" >> "$GITHUB_ENV"
        # Cargo's dependency caches only grow: each restores the last and saves what both
        # hold. A new generation every ISO week starts them clean; caches.yml fills it on
        # Monday, before the week's first queue run.
        echo "DISPATCH_RUST_CACHE=v0-rust-$(date -u +%G-W%V)" >> "$GITHUB_ENV"
    - name: Restore the CI and host tools
      id: tools
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .ci-tools/tools/
        key: ${{ steps.keys.outputs.tools }}
    - name: Restore the assessment fixture
      id: fixture
      if: inputs.fixture == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .ci-tools/fixture/
        key: ${{ steps.keys.outputs.fixture }}
