name: Removability
# The proof that each feature can be removed. Each job leaves one feature out of the app,
# with every feature that declares it, and the rest must still build, pass the app's tests,
# write its TypeScript, and typecheck and bundle its frontend; one more leaves every feature
# out, proving core depends on none. A failed job is named for the feature it left out, and
# says what reached into it. Weekly rather than in the queue, since
# it takes a build per feature; `npm run check:removability -- --feature <name>` runs one
# job's steps locally. Dispatched with a feature, as `dispatchdev ci <name> --removability
# <feature>` does, it runs that feature's job alone, in a run named for it.
run-name: ${{ inputs.feature && format('Removability without {0}', inputs.feature) || '' }}
on:
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:
    inputs:
      feature:
        description: One feature to leave out, alone; every feature when empty
        required: false
        type: string
permissions:
  contents: read
concurrency:
  # One feature's run replaces only an earlier run of that feature.
  group: removability-${{ github.ref }}${{ inputs.feature && format('-{0}', inputs.feature) || '' }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  # Every feature, as the feature map the app's export writes lists them, or the one asked for.
  features:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      features: ${{ steps.list.outputs.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: List the features
        id: list
        env:
          FEATURE: ${{ inputs.feature }}
        # A feature the map doesn't name fails in its job, where the script names the features.
        run: >-
          echo "features=$(jq -c --arg feature "$FEATURE"
          'if $feature == "" then keys else [$feature] end' app/generated/features.json)"
          >> "$GITHUB_OUTPUT"
  remove:
    needs: features
    name: without ${{ matrix.feature }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.features.outputs.features) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: ./.github/actions/setup-build
        with:
          profile: debug
          save: 'false'
      - name: Leave out ${{ matrix.feature }}
        env:
          FEATURE: ${{ matrix.feature }}
        run: npm run check:removability -- --feature "$FEATURE"
  every:
    name: without every feature
    if: ${{ !inputs.feature }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: ./.github/actions/setup-build
        with:
          profile: debug
          save: 'false'
      - name: Leave out every feature
        run: npm run check:removability -- --every
