name: Platform checks
# One run per change, in the merge queue, on the exact squash commit the queue will push:
# every regular suite, every time; the real timeout sentinel has its own weekly/manual lane.
# Nothing runs on the PR itself. The gate publishes the tested build, which Dev installs and a
# release stamps. A job that fails the gate tells the queue at once (fail-queue-entry), so the
# PR leaves it without waiting for the rest of the run. Manual runs check a branch, or one
# suite of it, on GitHub instead of on the machine that serves Dev. `dispatchdev ci` runs one
# on a change's branch while its preview is tried, without the gate: so it publishes nothing,
# and its PR's head carries no `platform` check but the one queue admission reads.
on:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      suite:
        description: What to run. Anything but "all" skips the gate, so the run publishes nothing.
        type: choice
        default: all
        options: [all, build, checks, browser, core, api, collectors, benchmark, smoke]
      spec:
        description: 'Browser suite only: spec files or a test name to run alone, as for npm run test:ui'
        type: string
        default: ''
      gate:
        description: Attest the build and judge the run with the gate, which publishes it. A change's branch run has neither.
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
  # A failed job reports the failed gate to the merge queue at once.
  checks: write
concurrency:
  # Every queue commit keeps its own run: it publishes the build Dev installs. Manual runs of
  # one branch replace each other.
  group: platform-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  # Empty for the queue, so every job runs. A manual run names one suite or all.
  SUITE: ${{ inputs.suite || 'all' }}
jobs:
  # Packages the runtime: the release backend and support worker, built together or from the
  # exact-input cache when their sources are unchanged, and the dashboard from Vite.
  # Everything that tests the runtime downloads this package instead of building again.
  build:
    if: contains('all build checks browser benchmark smoke', inputs.suite || 'all')
    permissions:
      contents: read
      id-token: write
      attestations: write
      checks: write
    outputs:
      rust-key: ${{ steps.tools.outputs.binary-key }}
      # Named by the attempt that built it. Rerunning only failed jobs keeps this job's
      # outputs, so the other jobs still find the bytes this job uploaded.
      candidate: ${{ steps.candidate.outputs.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: ./.github/actions/setup-build
        id: tools
        with:
          profile: release
          save: 'false'
      - name: Build the runtime
        run: npm run check:ci -- build
      - name: Package the runtime
        id: candidate
        run: |
          tar -czf dispatch-dev.tar.gz -C .build .
          echo "name=dispatch-candidate-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Attest the runtime package
        if: github.event_name != 'workflow_dispatch' || inputs.gate
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: dispatch-dev.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.candidate.outputs.name }}
          path: dispatch-dev.tar.gz
          if-no-files-found: error
          retention-days: 2
      - uses: ./.github/actions/fail-queue-entry
        if: failure() && github.event_name == 'merge_group'
  # Types, formatting, the bundle budget and the dashboard logic tests, against the package.
  # The bundle test verifies the package through the host tool, which setup-tools restores.
  checks:
    needs: build
    if: contains('all checks', inputs.suite || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.candidate }}
      - run: mkdir .build && tar -xzf dispatch-dev.tar.gz -C .build
      - run: npm run check:ci -- checks
      - uses: ./.github/actions/fail-queue-entry
        if: failure() && github.event_name == 'merge_group'
  # The browser suite in six shards of about equal time, three workers each, every test with
  # its own server, port, database and mail. Failed shards upload their traces.
  browser:
    needs: build
    if: contains('all browser', inputs.suite || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --ignore-scripts
      # The browser's system packages install in the background while the rest of the job
      # sets up, and the suite waits for them. The runner image already has the libraries
      # Chromium needs, so only what Playwright finds missing installs, less the fonts it adds
      # for other scripts' text, which the English suite never shows. Installed packages stay
      # as they are. Upgrades and those fonts only downloaded from a mirror that can stall for
      # minutes; a stalled download is dropped and tried again.
      - name: Start installing the browser's system packages
        run: |
          printf '%s\n' 'APT::Get::Upgrade "false";' 'Acquire::Retries "3";' \
            'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' |
            sudo tee /etc/apt/apt.conf.d/90-dispatch-ci > /dev/null
          (
            start=$SECONDS
            # The dry run lists what apt would install, one indented name a line, and exits 1
            # when there is any.
            missing=$(npx playwright install-deps --dry-run chromium | sed -n 's/^  //p' |
              grep -vE '^x?fonts-' || true)
            status=0
            if [ -n "$missing" ]; then
              echo "Installing" $missing
              sudo apt-get update -qq &&
                sudo apt-get install -y --no-install-recommends $missing || status=$?
            fi
            echo "Installed what the browser lacks in $((SECONDS - start))s"
            echo $status > "$RUNNER_TEMP/browser-packages.written"
            mv "$RUNNER_TEMP/browser-packages.written" "$RUNNER_TEMP/browser-packages.status"
          ) > "$RUNNER_TEMP/browser-packages.log" 2>&1 &
      - uses: ./.github/actions/setup-tools
        id: tools
        with:
          fixture: 'true'
      - name: Restore the pinned Playwright browser
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright/
          key: ${{ steps.tools.outputs.playwright-key }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.candidate }}
      - run: mkdir .build && tar -xzf dispatch-dev.tar.gz -C .build
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: steps.tools.outputs.fixture-hit != 'true'
        with:
          prefix-key: ${{ env.DISPATCH_RUST_CACHE }}
          shared-key: dispatch-debug
          cache-bin: 'false'
          save-if: 'false'
      - name: Browser suite shard ${{ matrix.shard }} of 6
        env:
          DISPATCH_BROWSER_PACKAGES: ${{ runner.temp }}/browser-packages
          # Manual text is data, never part of the runner's shell program.
          DISPATCH_BROWSER_SPEC: ${{ inputs.spec }}
        run: npm run check:ci -- browser ${{ matrix.shard }}/6
      - name: Preserve failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dispatch-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve large-folder measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dispatch-documents-performance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: test-results/**/attachments/documents-performance*.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: ./.github/actions/fail-queue-entry
        if: failure() && github.event_name == 'merge_group'
  # The packaged runtime starts, signs in and serves: what a release's smoke test asks of the
  # same bytes, so a release never finds out first. It speaks HTTP only, so it needs no browser.
  smoke:
    needs: build
    if: contains('all smoke', inputs.suite || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.candidate }}
      - run: mkdir .build && tar -xzf dispatch-dev.tar.gz -C .build
      - run: npm run check:ci -- smoke
      - uses: ./.github/actions/fail-queue-entry
        if: failure() && github.event_name == 'merge_group'
  # The workload regression measures the packaged build on a runner of its own. In the merge
  # queue a build that breaks a budget is judged again beside the base's build on the same
  # runner, so a runner that can't hold the budget for the base doesn't fail it.
  benchmark:
    needs: build
    if: contains('all benchmark', inputs.suite || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.candidate }}
      - run: mkdir .build && tar -xzf dispatch-dev.tar.gz -C .build
      # The base's package: the one its queue run published once it passed, or else that run's
      # build. Without one, as for a base still building, the budgets alone judge.
      - name: Fetch the base's build
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          api() { gh api "repos/$GITHUB_REPOSITORY/$1" "${@:2}"; }
          runs=$(api "actions/workflows/checks.yml/runs?event=merge_group&head_sha=$BASE&per_page=20" \
            --jq '.workflow_runs[] | select(.head_branch | startswith("gh-readonly-queue/main/")) | .id' || true)
          for run in $runs; do
            id=$(api "actions/runs/$run/artifacts?per_page=100" --jq "[.artifacts[] | select(.expired | not)
              | select(.name == \"dispatch-main-$BASE\" or (.name | startswith(\"dispatch-candidate-\")))]
              | sort_by(.name) | last | .id // empty" || true)
            if [ -n "$id" ] && api "actions/artifacts/$id/zip" > /tmp/base.zip \
              && python3 -m zipfile -e /tmp/base.zip /tmp/base && mkdir .baseline \
              && tar -xzf /tmp/base/dispatch-dev.tar.gz -C .baseline; then
              echo "Measuring beside the build of the base $BASE, from run $run."
              exit 0
            fi
            rm -rf .baseline
          done
          echo "No build of the base $BASE to measure beside: the budgets alone judge."
      - run: npm run check:ci -- benchmark
      - name: Preserve workload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dispatch-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/dispatch-rust-benchmark.json
            /tmp/dispatch-rust-benchmark-base.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: ./.github/actions/fail-queue-entry
        if: failure() && github.event_name == 'merge_group'
  # Rust formatting, lints and tests.
  core:
    if: contains('all core', inputs.suite || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-support-sandbox
      - uses: ./.github/actions/setup-tools
      - uses: ./.github/actions/setup-build
        with:
          profile: debug
          save: 'false'
      - run: npm run check:ci -- core
      - uses: ./.github/actions/fail-queue-entry
        if: failure() && github.event_name == 'merge_group'
  # The API tests against a debug backend, the Python tooling tests and the npm audit.
  api:
    if: contains('all api', inputs.suite || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-support-sandbox
      - uses: ./.github/actions/setup-tools
      - uses: ./.github/actions/setup-build
        with:
          profile: debug
          save: 'false'
      - run: npm run check:ci -- api
      - uses: ./.github/actions/fail-queue-entry
        if: failure() && github.event_name == 'merge_group'
  # The native collectors against their fixtures, with a real isolated browser.
  collectors:
    if: contains('all collectors', inputs.suite || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [paycom, paycom-recovery, cortex, cortex-meals, capacity]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: ./.github/actions/setup-build
        with:
          profile: debug
          save: 'false'
      - uses: ./.github/actions/setup-browseros
      - name: Native collector verification
        run: npm run test:browseros -- --shard ${{ matrix.shard }}
      - uses: ./.github/actions/fail-queue-entry
        if: failure() && github.event_name == 'merge_group'
  # `cargo audit`, denying every warning but the yanked versions `cargo-audit.py` allows, each
  # with its reason.
  rust-advisories:
    if: contains('all core', inputs.suite || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Cache audit tool
        id: audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2
      - name: Install audit tool
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: python3 tooling/ci/cargo-audit.py
      - uses: ./.github/actions/fail-queue-entry
        if: failure() && github.event_name == 'merge_group'
  # Builds the tools and fixture this ref's inputs lack, off the critical path, and saves
  # them to this ref's cache: the jobs that start later restore them instead of compiling.
  # `main`'s copies come from caches.yml. Every other job builds with Cargo when a tool is
  # absent, so a failure here only costs time.
  tools:
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        id: restore
        with:
          fixture: 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: steps.restore.outputs.tools-hit != 'true'
        with:
          prefix-key: ${{ env.DISPATCH_RUST_CACHE }}
          shared-key: dispatch-release
          cache-bin: 'false'
          save-if: 'false'
      - name: Build the CI and host tools
        if: steps.restore.outputs.tools-hit != 'true'
        run: |
          cargo build --locked --release -p dispatchdev-cli -p dispatch-host
          target=$(cargo metadata --locked --no-deps --format-version=1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          install -d -m 700 .ci-tools/tools
          install -m 700 "$target/release/dispatchdev" "$target/release/dispatch-host" .ci-tools/tools/
      - name: Save the CI and host tools
        if: steps.restore.outputs.tools-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ci-tools/tools/
          key: ${{ steps.restore.outputs.tools-key }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: steps.restore.outputs.fixture-hit != 'true'
        with:
          prefix-key: ${{ env.DISPATCH_RUST_CACHE }}
          shared-key: dispatch-debug
          cache-bin: 'false'
          save-if: 'false'
      - name: Build the assessment fixture
        if: steps.restore.outputs.fixture-hit != 'true'
        run: |
          cargo build --locked --example assessment-fixture
          target=$(cargo metadata --locked --no-deps --format-version=1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          install -d -m 700 .ci-tools/fixture
          install -m 700 "$target/debug/examples/assessment-fixture" .ci-tools/fixture/
      - name: Save the assessment fixture
        if: steps.restore.outputs.fixture-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ci-tools/fixture/
          key: ${{ steps.restore.outputs.fixture-key }}
  # The one required check. It passes only when every suite passed, then publishes the
  # verified build under the commit's name: Dev installs it and a release stamps it. A
  # manual run of one suite has no gate, so nothing partial is ever published.
  platform:
    # Named apart in a run without the gate, since even skipped it would report a check.
    name: ${{ (github.event_name != 'workflow_dispatch' || (inputs.gate && inputs.suite == 'all')) && 'platform' || 'no gate' }}
    needs: [build, checks, browser, smoke, benchmark, core, api, collectors, rust-advisories]
    if: always() && (inputs.suite || 'all') == 'all' && (github.event_name != 'workflow_dispatch' || inputs.gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every suite
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            echo "Suites that did not pass:"
            echo "$failed"
            exit 1
          fi
          echo "Every suite passed."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.candidate }}
      - name: Verify the build's source commit and inventory
        run: python3 tooling/ci/ci-verify.py dispatch-dev.tar.gz
      - name: Publish the verified build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dispatch-main-${{ github.sha }}
          path: dispatch-dev.tar.gz
          if-no-files-found: error
          # A release downloads this build; keep it as long as GitHub allows.
          retention-days: 90
