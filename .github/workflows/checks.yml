name: Platform checks
# Every suite a PR's change can reach on the PR (the changes job), and every suite again on each
# push to main: the squash commit the PR became. The `platform` gate is the one required check. On a PR it only judges; on main it also attests and
# publishes the tested build, which Dev installs. A manual run publishes the build of the commit it
# ran on the same way, as each release dispatches its own, which it stamps. Outside a PR the build
# of main or a release's branch carries DSP Dispatch: Relay, signed here: Dev's app, and
# Production's in a release's run (android/README.md#releases). A release's run that names main's
# passed push run of its commit (`tested-run`) skips the suites that tested the commit's source
# there, and builds, checks and smoke-tests the package it publishes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      relay-version:
        description: "Production's relay app version this release builds, as 0.0.1; empty carries the last released one"
        type: string
        default: ''
      tested-run:
        description: "Main's passed push run of these checks on the same commit, whose source suites this run skips"
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  # A PR's newer push replaces its run. Every commit of main keeps its own: each publishes the
  # build Dev installs.
  group: platform-checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  # Which suites the change can reach (tooling/ci/changes.py): on a PR, a suite skips when every
  # changed file is of a kind it never reads; outside a PR every suite runs but the Android apps',
  # which follow the change. Its checkout holds only the script and the two commits' trees.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      core: ${{ steps.changes.outputs.core }}
      api: ${{ steps.changes.outputs.api }}
      scaffold: ${{ steps.changes.outputs.scaffold }}
      collectors: ${{ steps.changes.outputs.collectors }}
      browser: ${{ steps.changes.outputs.browser }}
      android: ${{ steps.changes.outputs.android }}
      debug: ${{ steps.changes.outputs.debug }}
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            .github/actions/changes
            tooling/ci/changes.py
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/changes
        id: changes
  # DSP Dispatch: Relay's Dev app at this commit, a release build signed with the Dev key, for the
  # build to pack: on each commit of main, and in a dispatched run on main or a release's branch,
  # the branches the relay-dev environment allows. Built again only when android/, the app version
  # it names, or the key changed; otherwise the signed APK of the same inputs comes from the cache.
  relay-dev:
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-checks/v'))
    environment: relay-dev
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Every commit, not their files: the versionCode is the commit count.
          fetch-depth: 0
          filter: blob:none
      - name: Read the signing key
        id: key
        env:
          RELAY_KEYSTORE: ${{ secrets.RELAY_KEYSTORE }}
          RELAY_KEYSTORE_PASSWORD: ${{ secrets.RELAY_KEYSTORE_PASSWORD }}
          RELAY_KEY_ALIAS: ${{ secrets.RELAY_KEY_ALIAS }}
        run: python3 tooling/ci/relay.py key "$RUNNER_TEMP/relay.p12" >> "$GITHUB_OUTPUT"
      - name: Name the build
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tooling/ci/relay.py version dev >> "$GITHUB_OUTPUT"
      - name: Restore the signed build of the same inputs
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/relay-apps
          key: relay-dev-${{ steps.version.outputs.changed }}-${{ steps.version.outputs.next }}-${{ steps.key.outputs.cert }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '25'
      # Gradle's caches only read: a signing build saves nothing another run restores.
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: true
      # Neither Gradle's configuration cache nor its build cache, which would keep the signing
      # passwords or the signed outputs.
      - name: Build and sign
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: android
        env:
          RELAY_KEYSTORE_FILE: ${{ runner.temp }}/relay.p12
          RELAY_KEYSTORE_PASSWORD: ${{ secrets.RELAY_KEYSTORE_PASSWORD }}
          RELAY_KEY_ALIAS: ${{ secrets.RELAY_KEY_ALIAS }}
          RELAY_KEY_PASSWORD: ${{ secrets.RELAY_KEY_PASSWORD }}
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
        run: >-
          ./gradlew --no-configuration-cache --no-build-cache
          -Prelay.versionCode="$CODE" -Prelay.versionName="$NAME" :relay:assembleDevRelease
      - if: steps.cache.outputs.cache-hit != 'true'
        env:
          COMMIT: ${{ steps.version.outputs.commit }}
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
        run: >-
          python3 tooling/ci/relay.py entry dev
          android/relay/build/outputs/apk/dev/release/relay-dev-release.apk
          "$RUNNER_TEMP/relay-apps" "$COMMIT" "$CODE" "$NAME"
      - name: Check the signed build
        env:
          CERT: ${{ steps.key.outputs.cert }}
        run: python3 tooling/ci/relay.py signed "$RUNNER_TEMP/relay-apps" dev "$CERT"
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/relay-apps
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: relay-dev-apps
          path: ${{ runner.temp }}/relay-apps
          if-no-files-found: error
          overwrite: true
          retention-days: 2
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/relay.p12"
  # Production's app, in a release's run that names its version (the release command's
  # `relay-version`), built at the release's commit and signed with the Production key, which
  # only a release's branch may use.
  relay-production:
    if: github.event_name == 'workflow_dispatch' && inputs.relay-version != ''
    environment: relay-production
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: true
      - name: Read the signing key
        id: key
        env:
          RELAY_KEYSTORE: ${{ secrets.RELAY_KEYSTORE }}
          RELAY_KEYSTORE_PASSWORD: ${{ secrets.RELAY_KEYSTORE_PASSWORD }}
          RELAY_KEY_ALIAS: ${{ secrets.RELAY_KEY_ALIAS }}
        run: python3 tooling/ci/relay.py key "$RUNNER_TEMP/relay.p12" >> "$GITHUB_OUTPUT"
      - name: Name the build
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.relay-version }}
        run: python3 tooling/ci/relay.py version production "$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build and sign
        working-directory: android
        env:
          RELAY_KEYSTORE_FILE: ${{ runner.temp }}/relay.p12
          RELAY_KEYSTORE_PASSWORD: ${{ secrets.RELAY_KEYSTORE_PASSWORD }}
          RELAY_KEY_ALIAS: ${{ secrets.RELAY_KEY_ALIAS }}
          RELAY_KEY_PASSWORD: ${{ secrets.RELAY_KEY_PASSWORD }}
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
        run: >-
          ./gradlew --no-configuration-cache --no-build-cache
          -Prelay.versionCode="$CODE" -Prelay.versionName="$NAME" :relay:assembleProductionRelease
      - env:
          COMMIT: ${{ steps.version.outputs.commit }}
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
        run: >-
          python3 tooling/ci/relay.py entry production
          android/relay/build/outputs/apk/production/release/relay-production-release.apk
          "$RUNNER_TEMP/relay-apps" "$COMMIT" "$CODE" "$NAME"
      - name: Check the signed build
        env:
          CERT: ${{ steps.key.outputs.cert }}
        run: python3 tooling/ci/relay.py signed "$RUNNER_TEMP/relay-apps" production "$CERT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: relay-production-apps
          path: ${{ runner.temp }}/relay-apps
          if-no-files-found: error
          overwrite: true
          retention-days: 2
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/relay.p12"
  # Packages the runtime: the backend and support worker, built together or from the exact-input
  # cache when their sources are unchanged, and the dashboard from Vite, with the relay apps
  # signed above, or in a release's run without a new Production app, the one the latest release
  # carries. Everything that tests the runtime downloads this package instead of building again.
  # A PR's package carries the debug backend and worker, which compile in a fifth of the release
  # ones' time: it only feeds the PR's own tests, which main's run of the merged commit repeats on
  # the release build Dev installs. It compiles them beside the debug job rather than wait for
  # its build, so the browser suite, the last to end, starts that much sooner.
  build:
    needs: [relay-dev, relay-production]
    # Once the relay apps are built, or skipped, as on a PR, where it starts at once.
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      # Named by the attempt that built it. Rerunning only failed jobs keeps this job's
      # outputs, so the other jobs still find the bytes this job uploaded.
      candidate: ${{ steps.candidate.outputs.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: ./.github/actions/setup-build
        with:
          profile: ${{ github.event_name == 'pull_request' && 'debug' || 'release' }}
          save: 'false'
          binaries: 'true'
      # The relay apps go by fixed names, each attempt replacing the last, not by job outputs:
      # GitHub drops an output that holds a secret's value, and the relay environments hold
      # secrets that match words of these names.
      - if: needs.relay-dev.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: relay-dev-apps
          path: ${{ runner.temp }}/relay-apps
      - if: needs.relay-production.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: relay-production-apps
          path: ${{ runner.temp }}/relay-apps
      - name: Carry the released Production relay app
        if: github.event_name == 'workflow_dispatch' && inputs.relay-version == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tooling/ci/relay.py carry "$RUNNER_TEMP/relay-apps"
      - name: Build the runtime
        run: |
          if [ -d "$RUNNER_TEMP/relay-apps" ]; then
            export DISPATCH_RELAY_APPS="$RUNNER_TEMP/relay-apps"
          fi
          npm run check:ci -- build ${{ github.event_name == 'pull_request' && '--debug' || '' }}
      # Where the release compile spent its time, when it compiled.
      - name: Preserve the compile's timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dispatch-release-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 14
      - name: Package the runtime
        id: candidate
        run: |
          tar -czf dispatch-dev.tar.gz -C .build .
          echo "name=dispatch-candidate-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Attest the runtime package
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dispatch-dev.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.candidate.outputs.name }}
          path: dispatch-dev.tar.gz
          if-no-files-found: error
          retention-days: 2
  # The browser suite in six shards of about equal time, three workers each, every test with
  # its own server, port, database and mail. Failed shards upload their traces. A release's run
  # that names main's skips it: its package differs from main's only by the relay apps it packs,
  # which no browser test opens.
  browser:
    needs: [build, changes]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && !inputs.tested-run &&
      needs.changes.outputs.browser == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-packages
      # The browser's system packages install in the background while the rest of the job
      # sets up, and the suite waits for them. The runner image already has the libraries
      # Chromium needs, so only what Playwright finds missing installs, less the fonts it adds
      # for other scripts' text, which the English suite never shows. Installed packages stay
      # as they are. Upgrades and those fonts only downloaded from a mirror that can stall for
      # minutes; a stalled download is dropped and tried again.
      - name: Start installing the browser's system packages
        run: |
          printf '%s\n' 'APT::Get::Upgrade "false";' 'Acquire::Retries "3";' \
            'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' |
            sudo tee /etc/apt/apt.conf.d/90-dispatch-ci > /dev/null
          (
            start=$SECONDS
            # The dry run lists what apt would install, one indented name a line, and exits 1
            # when there is any.
            missing=$(npx playwright install-deps --dry-run chromium | sed -n 's/^  //p' |
              grep -vE '^x?fonts-' || true)
            status=0
            if [ -n "$missing" ]; then
              echo "Installing" $missing
              sudo apt-get update -qq &&
                sudo apt-get install -y --no-install-recommends $missing || status=$?
            fi
            echo "Installed what the browser lacks in $((SECONDS - start))s"
            echo $status > "$RUNNER_TEMP/browser-packages.written"
            mv "$RUNNER_TEMP/browser-packages.written" "$RUNNER_TEMP/browser-packages.status"
          ) > "$RUNNER_TEMP/browser-packages.log" 2>&1 &
      - uses: ./.github/actions/setup-tools
        id: tools
        with:
          fixture: 'true'
      - name: Restore the pinned Playwright browser
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright/
          key: ${{ steps.tools.outputs.playwright-key }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.build.outputs.candidate }}
      - run: mkdir .build && tar -xzf dispatch-dev.tar.gz -C .build
      - uses: ./.github/actions/setup-rust
        if: steps.tools.outputs.fixture-hit != 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: steps.tools.outputs.fixture-hit != 'true'
        with:
          prefix-key: ${{ env.DISPATCH_RUST_CACHE }}
          shared-key: dispatch-debug
          cache-bin: 'false'
          save-if: 'false'
      - name: Browser suite shard ${{ matrix.shard }} of 6
        env:
          DISPATCH_BROWSER_PACKAGES: ${{ runner.temp }}/browser-packages
        run: npm run check:ci -- browser ${{ matrix.shard }}/6
      - name: Preserve failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dispatch-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve large-folder measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dispatch-documents-performance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: test-results/**/attachments/documents-performance*.json
          if-no-files-found: ignore
          retention-days: 30
  # The packaged runtime starts, signs in and serves: what a release's smoke test asks of the
  # same bytes, so a release never finds out first. Beside it, the package's own test checks
  # its manifest through the host tool, which setup-tools restores, its build paths, caching
  # and bundle budgets. Both speak HTTP only, so it needs no browser. A release's run that
  # names main's runs it too: the package it publishes is its own.
  smoke:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        id: tools
      # The host tool the package's test runs builds with Cargo when its cache missed.
      - uses: ./.github/actions/setup-rust
        if: steps.tools.outputs.tools-hit != 'true'
      - uses: ./.github/actions/setup-packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.build.outputs.candidate }}
      - run: mkdir .build && tar -xzf dispatch-dev.tar.gz -C .build
      - run: npm run check:ci -- smoke
  # Source privacy, types, formatting, the linter and the dashboard logic tests.
  checks:
    if: ${{ !inputs.tested-run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-packages
      - run: npm run check:ci -- checks
  # Rust formatting and lints, and the operator probes compiled without running, beside core's
  # tests. Like core and the scaffold jobs, among the longest, it decides for itself whether the
  # change needs it, instead of waiting for the changes job.
  core-lint:
    if: ${{ !inputs.tested-run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/changes
        id: changes
      - if: steps.changes.outputs.core == 'true'
        uses: ./.github/actions/setup-tools
      - if: steps.changes.outputs.core == 'true'
        uses: ./.github/actions/setup-build
        with:
          profile: debug
          save: 'false'
      - if: steps.changes.outputs.core == 'true'
        run: npm run check:ci -- core lint
  # The Rust tests. A release's checks find a full run by this job's name.
  core:
    if: ${{ !inputs.tested-run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/changes
        id: changes
      - if: steps.changes.outputs.core == 'true'
        uses: ./.github/actions/setup-support-sandbox
      - if: steps.changes.outputs.core == 'true'
        uses: ./.github/actions/setup-tools
      - if: steps.changes.outputs.core == 'true'
        uses: ./.github/actions/setup-build
        with:
          profile: debug
          save: 'false'
      - if: steps.changes.outputs.core == 'true'
        run: npm run check:ci -- core tests
  # What every generator writes, made in a copy of the checkout: scaffold-lint holds it to
  # clippy, TypeScript, the linter and the rules, and scaffold runs its Rust tests and agent
  # tools' tests, side by side. The copy's path isn't the checkout's, so Cargo keeps none of its
  # crates between runs: both compile through sccache, whose cache main's run keeps.
  scaffold-lint:
    if: ${{ !inputs.tested-run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/changes
        id: changes
      - if: steps.changes.outputs.scaffold == 'true'
        uses: ./.github/actions/setup-tools
      - if: steps.changes.outputs.scaffold == 'true'
        uses: ./.github/actions/setup-build
        with:
          profile: debug
          save: 'false'
      # Each week's Rust cache starts empty until the caches workflow refills it, and the
      # generators update the lock offline: fetch the crates it names first.
      - if: steps.changes.outputs.scaffold == 'true'
        run: cargo fetch --locked
      - if: steps.changes.outputs.scaffold == 'true'
        uses: ./.github/actions/setup-sccache
        with:
          job: scaffold-lint
      - if: steps.changes.outputs.scaffold == 'true'
        run: npm run check:ci -- scaffold lint
      - if: always() && steps.changes.outputs.scaffold == 'true'
        run: sccache --show-stats
      # Main's run saves what it compiled for the PRs that start from it; caches.py keeps the
      # newest.
      - if: >-
          always() && steps.changes.outputs.scaffold == 'true' && github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/sccache
          key: dispatch-sccache-scaffold-lint-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
  scaffold:
    if: ${{ !inputs.tested-run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/changes
        id: changes
      - if: steps.changes.outputs.scaffold == 'true'
        uses: ./.github/actions/setup-tools
      - if: steps.changes.outputs.scaffold == 'true'
        uses: ./.github/actions/setup-build
        with:
          profile: debug
          save: 'false'
      # Each week's Rust cache starts empty until the caches workflow refills it, and the
      # generators update the lock offline: fetch the crates it names first.
      - if: steps.changes.outputs.scaffold == 'true'
        run: cargo fetch --locked
      - if: steps.changes.outputs.scaffold == 'true'
        uses: ./.github/actions/setup-sccache
        with:
          job: scaffold
      - if: steps.changes.outputs.scaffold == 'true'
        run: npm run check:ci -- scaffold tests
      - if: always() && steps.changes.outputs.scaffold == 'true'
        run: sccache --show-stats
      # Main's run saves what it compiled for the PRs that start from it; caches.py keeps the
      # newest.
      - if: >-
          always() && steps.changes.outputs.scaffold == 'true' && github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/sccache
          key: dispatch-sccache-scaffold-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
  # The Android apps in android/: their unit tests, lint (the dev debug and production release
  # builds) and debug builds, only when a change touches them or CI's own files (the changes
  # job), so any other change skips it. Release builds are signed only in relay-dev and
  # relay-production. A dispatched run always runs it, a release's that names main's too: main's
  # run of the commit tested the apps only if the commit changed them.
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '25'
      # Checks the wrapper's jar against Gradle's published checksums, and caches Gradle's own.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Test, lint and build
        working-directory: android
        run: ./gradlew test lintDevDebug lintProductionRelease assembleDebug
  # The debug backend and worker, built when the change reaches what they compile from (the
  # changes job), and saved for api and the collectors, which restore it instead of each
  # building their own, and for the build job of the PR's later pushes. Otherwise they restore main's, which main's own run of
  # this job saved.
  debug:
    needs: changes
    if: ${{ !inputs.tested-run && needs.changes.outputs.debug == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: ./.github/actions/setup-build
        id: tools
        with:
          profile: debug
          save: 'false'
          binaries: 'true'
      - name: Build the debug backend and support worker
        if: steps.tools.outputs.binary-hit != 'true'
        run: tooling/cli/dispatchdev build
      - name: Save the debug backend and support worker
        if: steps.tools.outputs.binary-key != '' && steps.tools.outputs.binary-hit != 'true' && hashFiles('.ci-rust-cache/**/sha256') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ci-rust-cache/
          key: dispatch-rust-binary-debug-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.binary-key }}
  # The API tests against the debug backend, the Python tooling tests and the npm audit.
  api:
    needs: [changes, debug]
    if: >-
      ${{ !cancelled() && !inputs.tested-run && needs.changes.outputs.api == 'true' &&
      (needs.debug.result == 'success' || needs.debug.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The tests' sandbox installs from apt while the rest sets up. It runs no action, so it
      # can't race the setup's own for the same one.
      - id: sandbox
        background: true
        uses: ./.github/actions/setup-support-sandbox
      - uses: ./.github/actions/setup-tools
      # Its only Rust build is the debug backend and worker, which the debug job or main's run
      # saved.
      - uses: ./.github/actions/setup-build
        with:
          profile: debug
          save: 'false'
          binaries: 'true'
      # The generators' tests update the lock offline: fetch the crates it names, which Cargo's
      # cache held before the restored binaries replaced it.
      - run: cargo fetch --locked
      - wait: sandbox
      - run: npm run check:ci -- api
  # The native collectors against their fixtures, with a real isolated browser.
  collectors:
    needs: [changes, debug]
    if: >-
      ${{ !cancelled() && !inputs.tested-run && needs.changes.outputs.collectors == 'true' &&
      (needs.debug.result == 'success' || needs.debug.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [paycom, paycom-recovery, cortex, cortex-meals, live-route-data, capacity]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      # The debug backend and worker the debug job or main's run saved; the capacity shard also
      # compiles the host's tests, so it keeps Cargo's dependency cache beside them.
      - uses: ./.github/actions/setup-build
        with:
          profile: debug
          save: 'false'
          binaries: 'true'
          dependencies: ${{ matrix.shard == 'capacity' }}
      # Not in the background: it restores its package with actions/cache, as the steps above do,
      # and two steps preparing the same action at once fail.
      - uses: ./.github/actions/setup-browseros
      - name: Native collector verification
        run: npm run test:browseros -- --shard ${{ matrix.shard }}
  # `cargo audit`, denying every warning but the yanked versions `cargo-audit.py` allows, each
  # with its reason. A release's run that names main's audits again: advisories come out by the
  # day, not by the commit.
  rust-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Cache audit tool
        id: audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2
      - name: Install audit tool
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: python3 tooling/ci/cargo-audit.py
  # Builds the tools and fixture this ref's inputs lack, off the critical path, and saves
  # them to this ref's cache: the jobs that start later restore them instead of compiling.
  # `main`'s copies come from caches.yml. Every other job builds with Cargo when a tool is
  # absent, so a failure here only costs time.
  tools:
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        id: restore
        with:
          fixture: 'true'
      - uses: ./.github/actions/setup-rust
        if: steps.restore.outputs.tools-hit != 'true' || steps.restore.outputs.fixture-hit != 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: steps.restore.outputs.tools-hit != 'true'
        with:
          prefix-key: ${{ env.DISPATCH_RUST_CACHE }}
          shared-key: dispatch-release
          cache-bin: 'false'
          save-if: 'false'
      - name: Build the CI and host tools
        if: steps.restore.outputs.tools-hit != 'true'
        run: |
          cargo build --locked --release -p dispatchdev-cli -p dispatch-host
          target=$(cargo metadata --locked --no-deps --format-version=1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          install -d -m 700 .ci-tools/tools
          install -m 700 "$target/release/dispatchdev" "$target/release/dispatch-host" .ci-tools/tools/
      - name: Save the CI and host tools
        if: steps.restore.outputs.tools-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ci-tools/tools/
          key: ${{ steps.restore.outputs.tools-key }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: steps.restore.outputs.fixture-hit != 'true'
        with:
          prefix-key: ${{ env.DISPATCH_RUST_CACHE }}
          shared-key: dispatch-debug
          cache-bin: 'false'
          save-if: 'false'
      - name: Build the assessment fixture
        if: steps.restore.outputs.fixture-hit != 'true'
        run: |
          cargo build --locked --example assessment-fixture
          target=$(cargo metadata --locked --no-deps --format-version=1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          install -d -m 700 .ci-tools/fixture
          install -m 700 "$target/debug/examples/assessment-fixture" .ci-tools/fixture/
      - name: Save the assessment fixture
        if: steps.restore.outputs.fixture-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ci-tools/fixture/
          key: ${{ steps.restore.outputs.fixture-key }}
  # The one required check. It passes only when every suite passed, the relay apps' builds too
  # wherever they ran, and the build carries the run's own commit and a complete inventory. In a
  # release's run that names main's, the source's suites passed there: GitHub must answer that the
  # run it names is main's passed push run of these checks on the same commit.
  # Outside a PR it then publishes that build under the commit's name: Dev installs main's, and a
  # release stamps its own run's.
  platform:
    needs:
      - changes
      - build
      - checks
      - browser
      - smoke
      - core-lint
      - core
      - debug
      - api
      - collectors
      - rust-advisories
      - scaffold-lint
      - scaffold
      - android
      - relay-dev
      - relay-production
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every suite
        env:
          RESULTS: ${{ toJSON(needs) }}
          TESTED_RUN: ${{ inputs.tested-run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The relay apps' builds may be skipped: they run outside PRs, Production's in a
          # release's run. So may the source's suites, in a release's run naming main's.
          skippable='["relay-dev", "relay-production"]'
          if [ -n "$TESTED_RUN" ]; then
            if ! [[ "$TESTED_RUN" =~ ^[1-9][0-9]*$ ]] ||
              ! tested=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN") ||
              ! echo "$tested" | jq -e --arg sha "$GITHUB_SHA" --arg repository "$GITHUB_REPOSITORY" '
                .event == "push" and .head_branch == "main" and .head_sha == $sha
                and .path == ".github/workflows/checks.yml"
                and .head_repository.full_name == $repository
                and .status == "completed" and .conclusion == "success"' > /dev/null; then
              echo "Run $TESTED_RUN is not main's passed push run of these checks on $GITHUB_SHA"
              exit 1
            fi
            echo "The source's suites passed in $(echo "$tested" | jq -r .html_url)"
            skippable='["relay-dev", "relay-production", "checks", "core-lint", "core", "debug", "api", "collectors", "scaffold-lint", "scaffold", "browser"]'
          fi
          # Each job and what it came to, a suite the change can't reach as not needed: core's and
          # scaffold's jobs pass without running it, and the others skip. A -lint job follows its
          # suite.
          {
            echo "Changed: $(echo "$RESULTS" | jq -r '.changes.outputs.changed // "unknown"')"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "$RESULTS" | jq -r '.changes.outputs as $needed | to_entries[]
              | "| \(.key) | \(if $needed[.key | sub("-lint$"; "")] == "false" then "not needed"
                else .value.result end) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          # A suite skips only where the changes job said the change can't reach it.
          failed=$(echo "$RESULTS" | jq -r --argjson skippable "$skippable" '
            .changes.outputs as $needed | to_entries[]
            | select(.value.result != "success")
            | select(.value.result != "skipped"
              or (((.key | IN($skippable[])) or $needed[.key | sub("-lint$"; "")] == "false") | not))
            | "\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            echo "Suites that did not pass:"
            echo "$failed"
            exit 1
          fi
          echo "Every suite passed."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        id: tools
      # The host tool the verification runs builds with Cargo when its cache missed.
      - uses: ./.github/actions/setup-rust
        if: steps.tools.outputs.tools-hit != 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.build.outputs.candidate }}
      - name: Verify the build's source commit and inventory
        run: python3 tooling/ci/ci-verify.py dispatch-dev.tar.gz
      - name: Publish the verified build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dispatch-main-${{ github.sha }}
          path: dispatch-dev.tar.gz
          if-no-files-found: error
          # A release downloads this build; keep it as long as GitHub allows.
          retention-days: 90
