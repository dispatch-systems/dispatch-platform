name: Platform checks
# Every suite on every PR, and again on each push to main: the squash commit the PR became. The
# `platform` gate is the one required check. On a PR it only judges; on main it also attests and
# publishes the tested build, which Dev installs and a release stamps. A manual run publishes the
# build of the commit it ran on the same way, as a release asks for a commit whose build expired.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  # A PR's newer push replaces its run. Every commit of main keeps its own: each publishes the
  # build Dev installs.
  group: platform-checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  # Packages the runtime: the release backend and support worker, built together or from the
  # exact-input cache when their sources are unchanged, and the dashboard from Vite.
  # Everything that tests the runtime downloads this package instead of building again.
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      # Named by the attempt that built it. Rerunning only failed jobs keeps this job's
      # outputs, so the other jobs still find the bytes this job uploaded.
      candidate: ${{ steps.candidate.outputs.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: ./.github/actions/setup-build
        id: tools
        with:
          profile: release
          save: 'false'
      - name: Build the runtime
        run: npm run check:ci -- build
      - name: Package the runtime
        id: candidate
        run: |
          tar -czf dispatch-dev.tar.gz -C .build .
          echo "name=dispatch-candidate-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Attest the runtime package
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: dispatch-dev.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.candidate.outputs.name }}
          path: dispatch-dev.tar.gz
          if-no-files-found: error
          retention-days: 2
  # Types, formatting, the bundle budget and the dashboard logic tests, against the package.
  # The bundle test verifies the package through the host tool, which setup-tools restores.
  checks:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.13.0
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.candidate }}
      - run: mkdir .build && tar -xzf dispatch-dev.tar.gz -C .build
      - run: npm run check:ci -- checks
  # The browser suite in six shards of about equal time, three workers each, every test with
  # its own server, port, database and mail. Failed shards upload their traces.
  browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.13.0
          cache: npm
      - run: npm ci --ignore-scripts
      # The browser's system packages install in the background while the rest of the job
      # sets up, and the suite waits for them. The runner image already has the libraries
      # Chromium needs, so only what Playwright finds missing installs, less the fonts it adds
      # for other scripts' text, which the English suite never shows. Installed packages stay
      # as they are. Upgrades and those fonts only downloaded from a mirror that can stall for
      # minutes; a stalled download is dropped and tried again.
      - name: Start installing the browser's system packages
        run: |
          printf '%s\n' 'APT::Get::Upgrade "false";' 'Acquire::Retries "3";' \
            'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' |
            sudo tee /etc/apt/apt.conf.d/90-dispatch-ci > /dev/null
          (
            start=$SECONDS
            # The dry run lists what apt would install, one indented name a line, and exits 1
            # when there is any.
            missing=$(npx playwright install-deps --dry-run chromium | sed -n 's/^  //p' |
              grep -vE '^x?fonts-' || true)
            status=0
            if [ -n "$missing" ]; then
              echo "Installing" $missing
              sudo apt-get update -qq &&
                sudo apt-get install -y --no-install-recommends $missing || status=$?
            fi
            echo "Installed what the browser lacks in $((SECONDS - start))s"
            echo $status > "$RUNNER_TEMP/browser-packages.written"
            mv "$RUNNER_TEMP/browser-packages.written" "$RUNNER_TEMP/browser-packages.status"
          ) > "$RUNNER_TEMP/browser-packages.log" 2>&1 &
      - uses: ./.github/actions/setup-tools
        id: tools
        with:
          fixture: 'true'
      - name: Restore the pinned Playwright browser
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright/
          key: ${{ steps.tools.outputs.playwright-key }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.candidate }}
      - run: mkdir .build && tar -xzf dispatch-dev.tar.gz -C .build
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: steps.tools.outputs.fixture-hit != 'true'
        with:
          prefix-key: ${{ env.DISPATCH_RUST_CACHE }}
          shared-key: dispatch-debug
          cache-bin: 'false'
          save-if: 'false'
      - name: Browser suite shard ${{ matrix.shard }} of 6
        env:
          DISPATCH_BROWSER_PACKAGES: ${{ runner.temp }}/browser-packages
        run: npm run check:ci -- browser ${{ matrix.shard }}/6
      - name: Preserve failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dispatch-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve large-folder measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dispatch-documents-performance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: test-results/**/attachments/documents-performance*.json
          if-no-files-found: ignore
          retention-days: 30
  # The packaged runtime starts, signs in and serves: what a release's smoke test asks of the
  # same bytes, so a release never finds out first. It speaks HTTP only, so it needs no browser.
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.13.0
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.candidate }}
      - run: mkdir .build && tar -xzf dispatch-dev.tar.gz -C .build
      - run: npm run check:ci -- smoke
  # Rust formatting, lints and tests.
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-support-sandbox
      - uses: ./.github/actions/setup-tools
      - uses: ./.github/actions/setup-build
        with:
          profile: debug
          save: 'false'
      - run: npm run check:ci -- core
  # What every generator writes, made in a copy of the checkout: it builds, passes clippy,
  # TypeScript, the linter and the rules, and its Rust tests and agent tools' tests pass.
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: ./.github/actions/setup-build
        with:
          profile: debug
          save: 'false'
      # Each week's Rust cache starts empty until the caches workflow refills it, and the
      # generators update the lock offline: fetch the crates it names first.
      - run: cargo fetch --locked
      - run: npm run check:ci -- scaffold
  # The API tests against a debug backend, the Python tooling tests and the npm audit.
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-support-sandbox
      - uses: ./.github/actions/setup-tools
      - uses: ./.github/actions/setup-build
        with:
          profile: debug
          save: 'false'
      - run: npm run check:ci -- api
  # The native collectors against their fixtures, with a real isolated browser.
  collectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [paycom, paycom-recovery, cortex, cortex-meals, capacity]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: ./.github/actions/setup-build
        with:
          profile: debug
          save: 'false'
      - uses: ./.github/actions/setup-browseros
      - name: Native collector verification
        run: npm run test:browseros -- --shard ${{ matrix.shard }}
  # `cargo audit`, denying every warning but the yanked versions `cargo-audit.py` allows, each
  # with its reason.
  rust-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Cache audit tool
        id: audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2
      - name: Install audit tool
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: python3 tooling/ci/cargo-audit.py
  # Builds the tools and fixture this ref's inputs lack, off the critical path, and saves
  # them to this ref's cache: the jobs that start later restore them instead of compiling.
  # `main`'s copies come from caches.yml. Every other job builds with Cargo when a tool is
  # absent, so a failure here only costs time.
  tools:
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        id: restore
        with:
          fixture: 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: steps.restore.outputs.tools-hit != 'true'
        with:
          prefix-key: ${{ env.DISPATCH_RUST_CACHE }}
          shared-key: dispatch-release
          cache-bin: 'false'
          save-if: 'false'
      - name: Build the CI and host tools
        if: steps.restore.outputs.tools-hit != 'true'
        run: |
          cargo build --locked --release -p dispatchdev-cli -p dispatch-host
          target=$(cargo metadata --locked --no-deps --format-version=1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          install -d -m 700 .ci-tools/tools
          install -m 700 "$target/release/dispatchdev" "$target/release/dispatch-host" .ci-tools/tools/
      - name: Save the CI and host tools
        if: steps.restore.outputs.tools-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ci-tools/tools/
          key: ${{ steps.restore.outputs.tools-key }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: steps.restore.outputs.fixture-hit != 'true'
        with:
          prefix-key: ${{ env.DISPATCH_RUST_CACHE }}
          shared-key: dispatch-debug
          cache-bin: 'false'
          save-if: 'false'
      - name: Build the assessment fixture
        if: steps.restore.outputs.fixture-hit != 'true'
        run: |
          cargo build --locked --example assessment-fixture
          target=$(cargo metadata --locked --no-deps --format-version=1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          install -d -m 700 .ci-tools/fixture
          install -m 700 "$target/debug/examples/assessment-fixture" .ci-tools/fixture/
      - name: Save the assessment fixture
        if: steps.restore.outputs.fixture-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ci-tools/fixture/
          key: ${{ steps.restore.outputs.fixture-key }}
  # The one required check. It passes only when every suite passed and the build carries the
  # run's own commit and a complete inventory. Outside a PR it then publishes that build under
  # the commit's name: Dev installs it and a release stamps it.
  platform:
    needs: [build, checks, browser, smoke, core, api, collectors, rust-advisories, scaffold]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every suite
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            echo "Suites that did not pass:"
            echo "$failed"
            exit 1
          fi
          echo "Every suite passed."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.candidate }}
      - name: Verify the build's source commit and inventory
        run: python3 tooling/ci/ci-verify.py dispatch-dev.tar.gz
      - name: Publish the verified build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dispatch-main-${{ github.sha }}
          path: dispatch-dev.tar.gz
          if-no-files-found: error
          # A release downloads this build; keep it as long as GitHub allows.
          retention-days: 90
