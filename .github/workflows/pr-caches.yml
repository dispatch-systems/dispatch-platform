name: PR caches
# A PR's runs save caches only that PR reads. Once it closes nothing reads them again, so they go
# at once instead of holding room main's caches need until GitHub evicts them.
on:
  pull_request:
    types: [closed]
permissions:
  actions: write
concurrency:
  group: pr-caches-${{ github.event.pull_request.number }}
jobs:
  delete:
    # A fork's PR gets a token that can't delete; its caches age out on their own.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete the PR's caches
        env:
          GH_TOKEN: ${{ github.token }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?ref=$REF&per_page=100" \
            --jq '.actions_caches[] | "\(.id)\t\(.key)"' |
            while IFS=$'\t' read -r id key; do
              # GitHub may have evicted it since it was listed.
              if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" --silent; then
                echo "Deleted $key"
              else
                echo "Could not delete $key"
              fi
            done
