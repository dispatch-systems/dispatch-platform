name: Dependency security
# Nightly, so new advisories against unchanged dependencies surface; every checks run audits
# too. CodeQL analyses each push to main as well. Its alerts go to code scanning and gate no
# merge, so it runs after the merge instead of holding up a PR; a newer push to main replaces
# an analysis still running.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  audit:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-packages
        with:
          install: 'false'
      - run: npm audit --audit-level=high
      - uses: ./.github/actions/setup-rust
      - name: Cache audit tool
        id: audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2
      - name: Install audit tool
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: python3 tooling/ci/cargo-audit.py
  codeql:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: /language:${{ matrix.language }}
