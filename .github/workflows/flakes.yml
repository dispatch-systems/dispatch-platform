name: Flaky tests
# A job that failed and then passed on the same code is a flake, or a runner problem, and
# either costs a merge. This lists them weekly in the run's summary: reruns of one run, queue
# entries that failed and then merged with the PR's head unchanged, since a PR queued again
# gets a new run on a new squash commit, unless the entry ahead of it failed the same job, and
# branch runs (`dispatchdev ci`) whose job failed and later passed on the same commit. A week
# with any is also posted to the open `flaky-tests` issue, which it opens when there is none.
# It changes nothing else.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: List jobs that failed on one attempt and passed on a later one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          since=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "## Jobs that failed, then passed on a rerun, since $since"
            echo
            echo "| Run | Job | Failed attempt |"
            echo "| --- | --- | --- |"
          } > report.md
          found=0
          for run in $(gh api "repos/$REPO/actions/workflows/checks.yml/runs?created=>=$since&status=success&per_page=100" --paginate \
              --jq '.workflow_runs[] | select(.run_attempt > 1) | "\(.id):\(.run_attempt)"'); do
            id=${run%%:*}
            attempts=${run##*:}
            attempt=1
            while [ "$attempt" -lt "$attempts" ]; do
              gh api "repos/$REPO/actions/runs/$id/attempts/$attempt/jobs?per_page=100" \
                --jq ".jobs[] | select(.conclusion == \"failure\" or .conclusion == \"timed_out\") | \"| [$id](https://github.com/$REPO/actions/runs/$id) | \\(.name) | $attempt |\"" >> report.md \
                && found=1 || true
              attempt=$((attempt + 1))
            done
          done
          if ! grep -q '^| \[' report.md; then
            echo "| none | | |" >> report.md
          fi
          # A head older than a fortnight is left out: such an entry is not listed.
          heads=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          SINCE="$since" HEADS_SINCE="$heads" python3 - >> report.md <<'EOF'
          import json, os, re, subprocess
          from collections import defaultdict

          repo, since, heads = os.environ["REPO"], os.environ["SINCE"], os.environ["HEADS_SINCE"]

          def api(path, jq):
              out = subprocess.run(["gh", "api", "--paginate", path, "--jq", jq],
                                   check=True, capture_output=True, text=True).stdout
              return [json.loads(line) for line in out.splitlines() if line]

          fields = ("{id, conclusion, head_branch, head_sha, created_at, html_url,"
                    " source: .head_repository.full_name}")
          queue = api(f"repos/{repo}/actions/workflows/checks.yml/runs"
                      f"?event=merge_group&created=>={since}&per_page=100", f".workflow_runs[] | {fields}")
          # The admission check runs on every push to a PR, so its runs date each head. They
          # outlive the PR's number, which GitHub drops from a run once the branch is gone, so
          # they are matched by the PR's branch and the repository it lives in, as forks can
          # share a branch name.
          admitted = api(f"repos/{repo}/actions/workflows/queue-admission.yml/runs"
                         f"?created=>={heads}&per_page=100", f".workflow_runs[] | {fields}")
          # An entry is tested on top of the entry queued ahead of it, whose head its branch
          # names, so a job that also failed there failed for that PR rather than this one.
          failed_heads = {run["head_sha"]: run for run in queue if run["conclusion"] == "failure"}

          def failed_jobs(run):
              return [job["name"] for job in api(
                  f"repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100",
                  '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | {name}')]

          entries = defaultdict(list)
          for run in sorted(queue, key=lambda run: run["created_at"]):
              number = re.match(r"gh-readonly-queue/main/pr-(\d+)-", run["head_branch"] or "")
              if number:
                  entries[int(number[1])].append(run)
          print(f"\n## Queue entries that failed, then merged with the PR unchanged, since {since}\n")
          print("| PR | Failed run | Job | Passed run |")
          print("| --- | --- | --- | --- |")
          rows = 0
          for number, runs in sorted(entries.items()):
              head = None
              for index, failed in enumerate(runs):
                  passed = next((run for run in runs[index + 1:] if run["conclusion"] == "success"), None)
                  if failed["conclusion"] != "failure" or passed is None:
                      continue
                  if head is None:
                      head = api(f"repos/{repo}/pulls/{number}",
                                 "{branch: .head.ref, source: .head.repo.full_name}")[0]

                  def head_at(at):
                      earlier = [run for run in admitted
                                 if head["source"] and run["source"] == head["source"]
                                 and run["head_branch"] == head["branch"] and run["created_at"] < at]
                      return max(earlier, key=lambda run: run["created_at"])["head_sha"] if earlier else None

                  if head_at(failed["created_at"]) is None or head_at(failed["created_at"]) != head_at(passed["created_at"]):
                      continue
                  ahead = failed_heads.get(failed["head_branch"].rsplit("-", 1)[1])
                  ahead_jobs = failed_jobs(ahead) if ahead else []
                  for job in failed_jobs(failed):
                      if job != "platform" and job not in ahead_jobs:
                          rows += 1
                          print(f"| #{number} | [{failed['id']}]({failed['html_url']}) | {job} "
                                f"| [{passed['id']}]({passed['html_url']}) |")
          if not rows:
              print("| none | | | |")

          # A branch run is run again on the same commit only after a failure, the whole suite or
          # the failed one alone: a job that passes there later failed for no reason of the code.
          branch = api(f"repos/{repo}/actions/workflows/checks.yml/runs"
                       f"?event=workflow_dispatch&created=>={since}&per_page=100", f".workflow_runs[] | {fields}")
          commits = defaultdict(list)
          for run in sorted(branch, key=lambda run: run["created_at"]):
              commits[run["head_sha"]].append(run)
          passed_jobs = {}

          def passing(run):
              if run["id"] not in passed_jobs:
                  passed_jobs[run["id"]] = {job["name"] for job in api(
                      f"repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100",
                      '.jobs[] | select(.conclusion == "success") | {name}')}
              return passed_jobs[run["id"]]

          print(f"\n## Branch runs whose job failed, then passed on the same commit, since {since}\n")
          print("| Failed run | Job | Branch | Passed run |")
          print("| --- | --- | --- | --- |")
          rows = 0
          for runs in commits.values():
              for index, failed in enumerate(runs):
                  if failed["conclusion"] != "failure":
                      continue
                  for job in failed_jobs(failed):
                      passed = next((run for run in runs[index + 1:] if job in passing(run)), None)
                      if job != "platform" and passed:
                          rows += 1
                          print(f"| [{failed['id']}]({failed['html_url']}) | {job} | {failed['head_branch']} "
                                f"| [{passed['id']}]({passed['html_url']}) |")
          if not rows:
              print("| none | | | |")
          EOF
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cat report.md
      # A run's summary goes unread, so a week with a flake reaches the issue's watchers.
      - name: Post the week's flakes to the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          grep -qE '^\| (\[|#[0-9])' report.md || exit 0
          issue=$(gh issue list --repo "$REPO" --label flaky-tests --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$REPO" --body-file report.md
          else
            gh label create flaky-tests --repo "$REPO" --force --color d93f0b \
              --description 'Jobs that failed, then passed on the same code'
            gh issue create --repo "$REPO" --title 'Flaky tests' --label flaky-tests \
              --body-file report.md
          fi
