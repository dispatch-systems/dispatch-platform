name: Shared caches
# Only main's caches reach every branch: a PR's run saves caches only that PR reads. This
# refills, on every push to main, everything the platform checks only restore, and nothing
# waits on it; then it deletes main's caches that newer ones replaced. Early each Monday it
# fills the week's new generation of Cargo's caches (setup-tools), so the week's first run does
# not compile from nothing.
on:
  push:
    branches: [main]
  schedule:
    - cron: '5 0 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-caches
env:
  # Match the platform checks, so the Rust cache keys and build outputs are theirs.
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  # The workspace's packages as `npm ci` installs them, which every job restores instead.
  packages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-packages
        with:
          save: 'true'
  browsers:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        id: keys
      - name: Restore the pinned Playwright browser
        id: playwright
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright/
          key: ${{ steps.keys.outputs.playwright-key }}
      - uses: ./.github/actions/setup-packages
        if: steps.playwright.outputs.cache-hit != 'true'
      - name: Download the pinned Playwright browser
        if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Save the pinned Playwright browser
        if: steps.playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright/
          key: ${{ steps.keys.outputs.playwright-key }}
      # Installing verifies the pinned checksum and size before the package is saved.
      - uses: ./.github/actions/setup-browseros
        id: browseros
      - name: Save the pinned BrowserOS package
        if: steps.browseros.outputs.package-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/dispatch-browseros/browseros.deb
          key: dispatch-browseros-${{ hashFiles('ops/launchers/browseros-release.json') }}
  # The release backend and support worker, both as Cargo's dependency cache and as the
  # exact-input binaries the build job restores when the Rust sources are unchanged.
  release-binary:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: ./.github/actions/setup-build
        id: tools
        with:
          profile: release
          # The week's new cache generation fills only from a compile.
          reuse-binary: ${{ github.event_name != 'schedule' }}
      - name: Compile the release backend and support worker
        if: steps.tools.outputs.binary-hit != 'true'
        run: tooling/cli/dispatchdev build --release
      - name: Save the release backend and support worker
        if: steps.tools.outputs.binary-key != '' && steps.tools.outputs.binary-hit != 'true' && hashFiles('.ci-rust-cache/**/sha256') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ci-rust-cache/
          key: dispatch-rust-binary-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.binary-key }}
  # Cargo's dependency cache for a PR's release build, which compiles without LTO when main's
  # exact binaries don't fit it (setup-build). Compiled only when the week's generation or the
  # lockfile has none: its outputs are no one's but a PR's.
  pr-release-dependencies:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_RELEASE_LTO: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        id: cache
        with:
          prefix-key: ${{ env.DISPATCH_RUST_CACHE }}
          shared-key: dispatch-nolto
          cache-bin: 'false'
      # The packages and arguments of `dispatchdev build --release`, so the dependencies compile
      # with the features and flags a PR's build asks of them.
      - name: Compile the release backend and support worker without LTO
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release -p dispatch-backend -p dispatch-support-worker
  # The CI and host tools and the assessment fixture, built from main's inputs so every
  # branch whose inputs match restores them instead of compiling, and the pinned Rust toolchain.
  tools:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # A new generation of the debug cache compiles every dependency for each of the Rust jobs.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        id: restore
        with:
          fixture: 'true'
      # Saves the pinned toolchain, which every Rust job restores, when this pin has none.
      - uses: ./.github/actions/setup-rust
        with:
          save: 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: steps.restore.outputs.tools-hit != 'true'
        with:
          prefix-key: ${{ env.DISPATCH_RUST_CACHE }}
          shared-key: dispatch-release
          cache-bin: 'false'
          save-if: 'false'
      - name: Build the CI and host tools
        if: steps.restore.outputs.tools-hit != 'true'
        run: |
          cargo build --locked --release -p dispatchdev-cli -p dispatch-host
          target=$(cargo metadata --locked --no-deps --format-version=1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          install -d -m 700 .ci-tools/tools
          install -m 700 "$target/release/dispatchdev" "$target/release/dispatch-host" .ci-tools/tools/
      - name: Save the CI and host tools
        if: steps.restore.outputs.tools-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ci-tools/tools/
          key: ${{ steps.restore.outputs.tools-key }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        id: debug-cache
        with:
          prefix-key: ${{ env.DISPATCH_RUST_CACHE }}
          shared-key: dispatch-debug
          cache-bin: 'false'
      # Also when the fixture is current but the week's debug cache is new: this fills it.
      - name: Build the assessment fixture
        if: steps.restore.outputs.fixture-hit != 'true' || steps.debug-cache.outputs.cache-hit != 'true'
        run: |
          cargo build --locked --example assessment-fixture
          target=$(cargo metadata --locked --no-deps --format-version=1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          install -d -m 700 .ci-tools/fixture
          install -m 700 "$target/debug/examples/assessment-fixture" .ci-tools/fixture/
      - name: Save the assessment fixture
        if: steps.restore.outputs.fixture-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ci-tools/fixture/
          key: ${{ steps.restore.outputs.fixture-key }}
      # The fixture's build alone left clippy re-checking every dependency, the tests and the
      # capacity shard compiling those it doesn't use, in every run: whenever the debug cache is
      # new, what each of them compiles goes in too (`check:ci -- cache`).
      - uses: ./.github/actions/setup-packages
        if: steps.debug-cache.outputs.cache-hit != 'true'
      - name: Fill the debug cache with what the Rust jobs compile
        if: steps.debug-cache.outputs.cache-hit != 'true'
        run: npm run check:ci -- cache
      # The release tools above were built in the same target directory, and the debug cache
      # saves what it holds when the job ends: only the debug build belongs in it.
      - name: Leave the release build out of the debug cache
        run: |
          target=$(cargo metadata --locked --no-deps --format-version=1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          rm -rf "$target/release"
  # Once the others saved theirs, main's older caches of each kind go, and closed PRs' caches
  # (tooling/ci/caches.py), so the repository stays under GitHub's 10 GB and nothing current is
  # evicted for them.
  prune:
    needs: [packages, browsers, release-binary, pr-release-dependencies, tools]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: tooling/ci/caches.py
          sparse-checkout-cone-mode: false
      - name: Delete the caches newer ones replaced
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tooling/ci/caches.py prune
