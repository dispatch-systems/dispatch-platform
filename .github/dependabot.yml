# Dependabot keeps the platform's dependencies at their latest releases. Each Monday it opens one
# PR per ecosystem with its minor and patch updates, and one of its own for each major release,
# which may need code changes. It proposes a release once it's three days old, its default, so a
# bad one is likely withdrawn first. Its PRs run the same checks and merge by hand like any other.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint, whose type-checked rules the linter runs, supports TypeScript below 6.1.
      - dependency-name: typescript
        versions: ['>=6.1.0']
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        update-types: [minor, patch]
  # The Rust release rust-toolchain.toml pins.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      gradle:
        update-types: [minor, patch]
