[workspace]
members = ["core", "collectors/*", "features/*", "features/*/contract", "mcp", "app/backend", "ops/host-manager", "tooling/cli", "tooling/shared", "services/support-worker"]
resolver = "3"

# The platform version lives in package.json. Crate versions stay fixed so a release
# bump leaves the Rust inputs, and the cached release backend, unchanged.
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "FSL-1.1-ALv2"

# The outside crates the platform's crates share, each at one version with one set of
# features. A crate lists only those it uses, as `{ workspace = true }`.
[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
rusqlite = { version = "0.41", features = ["bundled", "functions", "collation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
aes-gcm = "0.11"
argon2 = "0.6"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
flate2 = "1"
fs2 = "0.4"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
libc = "0.2"
icu_collator = "2"
sha2 = "0.11"
# Web Push's keys and signatures: the P-256 that WebAuthn already builds.
p256 = { version = "0.14", default-features = false, features = ["alloc", "ecdh", "ecdsa"] }
subtle = "2"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "cookies", "form", "gzip", "http2", "json", "query", "rustls", "stream"] }
scraper = { version = "0.29", default-features = false }
ego-tree = "0.11"
html5ever = "0.40"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sha1 = "0.11"
webauthn-rs = { version = "0.6.2", default-features = false, features = ["danger-allow-state-serialisation"] }
calamine = { version = "0.38.0", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-streamable-http-server"] }
# The JSON Schema of what each agent tool takes and answers, which the MCP server publishes.
schemars = "1"
tempfile = "3"
# Roster photos, shrunk where they're collected: JPEG decoded straight at a fraction of its size,
# PNG, a resize and a JPEG encoder. The JPEG decoder's rayon pool stays off: without it, each
# decode hands its colour components to short-lived threads of its own, mostly waiting on the
# one reading the file, so a shrink costs little more than a core.
jpeg-decoder = { version = "0.3", default-features = false }
png = "0.18"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
fast_image_resize = "6"
jpeg-encoder = "0.7"
# Writes the TypeScript the API types are exported to; never part of the binary.
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }

[profile.release]
lto = "thin"
strip = true

# Debug builds keep file and line numbers, for panics and backtraces, and nothing more. Full
# debug info was nine tenths of every test program, hundreds of megabytes each, linked into
# each of them again. Libraries carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Unoptimised, one password hash takes about half a second against 22 ms in release, and the
# API and collector tests sign in hundreds of times against a debug backend. Only the hashing
# crates are optimised for speed; debug assertions stay on everywhere.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# rustls's crypto, built from C, maps its sources' paths out of what it builds only when
# optimised, as in release; unoptimised, its error messages name this machine's Cargo folder.
[profile.dev.package.aws-lc-sys]
opt-level = 3
