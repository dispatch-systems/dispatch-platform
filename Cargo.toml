[workspace]
members = ["core", "collectors/*", "features/driver_match", "features/dvic", "features/home", "features/routes", "features/scorecard", "features/settings", "features/team", "features/timecard", "features/uniforms", "app/backend", "ops/host-manager", "tooling/ci/dispatch-ci"]
resolver = "3"

# The platform version lives in package.json. Crate versions stay fixed so a release
# bump leaves the Rust inputs, and the cached release backend, unchanged.
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "FSL-1.1-ALv2"

# The outside crates the platform's crates share, each at one version with one set of
# features. A crate lists only those it uses, as `{ workspace = true }`.
[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
rusqlite = { version = "0.40", features = ["bundled", "functions", "collation", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
aes-gcm = "0.11"
argon2 = "0.6"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
flate2 = "1"
fs2 = "0.4"
getrandom = "0.4"
hmac = "0.13"
libc = "0.2"
icu_collator = "2"
sha2 = "0.11"
subtle = "2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "gzip", "http2", "json", "rustls-tls"] }
scraper = { version = "0.27", default-features = false }
ego-tree = "0.11"
html5ever = "0.39"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sha1 = "0.11"
webauthn-rs = { version = "0.5.5", default-features = false, features = ["danger-allow-state-serialisation"] }
calamine = { version = "0.36.1", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-streamable-http-server"] }
tempfile = "3"
# Writes the TypeScript the API types are exported to; never part of the binary.
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }

[profile.release]
lto = "thin"
strip = true

# Unoptimised, one password hash takes about half a second against 22 ms in release, and the
# API and collector tests sign in hundreds of times against a debug backend. Only the hashing
# crates are optimised; debug assertions stay on everywhere.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
