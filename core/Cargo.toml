[package]
name = "dispatch-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

[lib]
path = "core.rs"
doctest = false

[features]
# `dispatch_core::testing`, for other crates' tests through their dev-dependencies.
testing = ["dep:tempfile"]
# TypeScript definitions of core's API types, for the app's export test; never in a build.
ts = ["dep:ts-rs"]

[dependencies]
aes-gcm = { workspace = true }
argon2 = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
fs2 = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
icu_collator = { workspace = true }
lettre = { workspace = true }
libc = { workspace = true }
qrcode = { workspace = true }
reqwest = { workspace = true }
rmcp = { workspace = true }
rusqlite = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
# Answers keep the order their fields are written in. The binary always had this through
# dispatch-host; core's own tests need it too.
serde_json = { workspace = true, features = ["preserve_order"] }
sha1 = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true }
ts-rs = { workspace = true, optional = true }
url = { workspace = true }
webauthn-rs = { workspace = true }

[dev-dependencies]
dispatch-core = { path = ".", features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "integration"
path = "db/tests/backend/integration/main.rs"

