[package]
name = "dispatch-paycom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

[lib]
path = "collector.rs"
doctest = false

[features]
# Its live probes, for an operator who asks for them; never in a build that ships.
operator-probes = ["dep:libc"]
# TypeScript definitions of its API types, for the app's export test; never in a build.
ts = ["dep:ts-rs"]

# Core's parts only: a collector names no feature.
[dependencies]
dispatch-core = { path = "../../core" }
chrono = { workspace = true }
chrono-tz = { workspace = true }
ego-tree = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
html5ever = { workspace = true }
libc = { workspace = true, optional = true }
rusqlite = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true }
# What it collects keeps the order its fields are written in.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = { workspace = true }
tokio = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
dispatch-core = { path = "../../core", features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
