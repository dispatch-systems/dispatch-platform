# The platform version lives in package.json. Crate versions stay fixed so a release
# bump leaves the Rust inputs, and the cached release backend, unchanged.
[package]
name = "dispatchdev-cli"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "FSL-1.1-ALv2"

[lib]
name = "dispatchdev_cli"
path = "src/lib.rs"

[[bin]]
name = "dispatchdev"
path = "src/main.rs"
# It holds no tests; its commands are tested through the library and tests/.
test = false

[dependencies]
dispatch-shared = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tempfile = "3"
fs2 = "0.4"
libc = "0.2"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
