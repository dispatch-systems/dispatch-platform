# The platform version lives in package.json. Crate versions stay fixed so a release
# bump leaves the Rust inputs, and the cached release backend, unchanged.
[package]
name = "dispatch-shared"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "FSL-1.1-ALv2"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
libc = "0.2"
