# The policy hash changes Cargo dependency fingerprints when the wrapper changes.
# Recompute it with SHA-256 after editing tooling/build/rustc-remap.py.
[build]
rustc-wrapper = "tooling/build/rustc-remap.py"
rustflags = ["--cfg=dispatch_path_policy_5b008e4af08a4af7f4b463629d367f38f168d7b628389241f0a1e79b55f27718"]
