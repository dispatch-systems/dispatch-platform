[package]
name = "dispatch-dvic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

[lib]
path = "feature.rs"
doctest = false

[features]
# TypeScript definitions of its API types, for the app's export test; never in a build. They
# name core's, whose definitions core's own ts feature brings.
ts = ["dep:ts-rs", "dispatch-core/ts"]

# Core, and the Cortex collector whose inspections it keeps.
[dependencies]
dispatch-core = { path = "../../core" }
dispatch-cortex = { path = "../../collectors/cortex" }
chrono = { workspace = true }
chrono-tz = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
# Its answers keep the order their fields are written in.
serde_json = { workspace = true, features = ["preserve_order"] }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
dispatch-core = { path = "../../core", features = ["testing"] }
tempfile = { workspace = true }

[[test]]
name = "dvic"
path = "tests/backend/integration/dvic.rs"
