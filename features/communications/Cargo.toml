[package]
name = "dispatch-communications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

[lib]
path = "feature.rs"
doctest = false

[features]
# TypeScript definitions of its API types, for the app's export test; never in a build.
ts = ["dep:ts-rs", "dispatch-core/ts"]

# Core, the collectors it uses, the features it declares and the contracts it reads: nothing else
# compiles.
[dependencies]
axum = { workspace = true }
chrono-tz = { workspace = true }
dispatch-core = { path = "../../core" }
dispatch-phones-contract = { path = "../phones/contract" }
dispatch-routes-contract = { path = "../routes/contract" }
dispatch-slack = { path = "../slack" }
dispatch-vans-contract = { path = "../vans/contract" }
flate2 = { workspace = true }
futures-util = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
# Times of the DSP's own day, as texts and work phones' holds are written.
chrono = { workspace = true }
dispatch-core = { path = "../../core", features = ["testing"] }
dispatch-slack = { path = "../slack", features = ["testing"] }
# A clock the tests move, through sending's pace between posts.
tokio = { workspace = true, features = ["test-util"] }
