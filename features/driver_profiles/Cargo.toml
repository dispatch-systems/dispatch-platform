[package]
name = "dispatch-driver-profiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

[lib]
path = "feature.rs"
doctest = false

# Core, the collectors it uses and the features it declares: nothing else compiles.
[dependencies]
dispatch-core = { path = "../../core" }
dispatch-cortex = { path = "../../collectors/cortex" }
chrono = { workspace = true }
chrono-tz = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
# Its answers keep the order their fields are written in.
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true }
dispatch-driver-profiles-contract = { path = "contract" }

[dev-dependencies]
dispatch-core = { path = "../../core", features = ["testing"] }
