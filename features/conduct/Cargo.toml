[package]
name = "dispatch-conduct"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

[lib]
path = "feature.rs"
doctest = false

[features]
# TypeScript definitions of its API types, for the app's export test; never in a build.
ts = ["dep:ts-rs", "dispatch-core/ts"]

# Core, the collectors it uses and the features it declares: nothing else compiles.
[dependencies]
dispatch-core = { path = "../../core" }
chrono = { workspace = true }
chrono-tz = { workspace = true }
futures-util = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
dispatch-core = { path = "../../core", features = ["testing"] }
tempfile = { workspace = true }
