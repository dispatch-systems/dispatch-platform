[package]
name = "dispatch-uniforms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

[lib]
path = "feature.rs"
doctest = false

[features]
# TypeScript definitions of its API types, for the app's export test; never in a build.
ts = ["dep:ts-rs"]

# Core alone: it declares no collector or feature.
[dependencies]
dispatch-core = { path = "../../core" }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
dispatch-core = { path = "../../core", features = ["testing"] }
tempfile = { workspace = true }
