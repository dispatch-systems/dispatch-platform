[package]
name = "dispatch-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false
autoexamples = false

[lib]
path = "lib.rs"

[[bin]]
name = "dispatch-backend"
path = "main.rs"

[features]
# Private live-provider diagnostics are compiled only when an operator asks for them.
operator-probes = []

[dependencies]
dispatch-host = { path = "../../ops/host-manager" }
axum = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
aes-gcm = { workspace = true }
argon2 = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
flate2 = { workspace = true }
fs2 = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
libc = { workspace = true }
icu_collator = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
scraper = { workspace = true }
ego-tree = { workspace = true }
html5ever = { workspace = true }
futures-util = { workspace = true }
lettre = { workspace = true }
qrcode = { workspace = true }
sha1 = { workspace = true }
webauthn-rs = { workspace = true }
calamine = { workspace = true }
zip = { workspace = true }
rmcp = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
# Writes shared/contracts/generated from the response types; never part of the binary.
ts-rs = { workspace = true }

