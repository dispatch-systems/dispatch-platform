[package]
name = "dispatch-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false
autoexamples = false

[lib]
path = "lib.rs"
doctest = false

[[bin]]
name = "dispatch-backend"
path = "main.rs"

[features]
# Private live-provider diagnostics are compiled only when an operator asks for them.
operator-probes = ["dispatch-cortex/operator-probes", "dispatch-paycom/operator-probes"]

[dependencies]
dispatch-core = { path = "../../core" }
dispatch-cortex = { path = "../../collectors/cortex" }
dispatch-driver-match = { path = "../../features/driver_match" }
dispatch-home = { path = "../../features/home" }
dispatch-host = { path = "../../ops/host-manager" }
dispatch-paycom = { path = "../../collectors/paycom" }
dispatch-routes = { path = "../../features/routes" }
dispatch-settings = { path = "../../features/settings" }
dispatch-team = { path = "../../features/team" }
dispatch-uniforms = { path = "../../features/uniforms" }
axum = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
flate2 = { workspace = true }
libc = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
# Core's test support, and the TypeScript of every crate's API types for the export test.
dispatch-core = { path = "../../core", features = ["testing", "ts"] }
dispatch-driver-match = { path = "../../features/driver_match", features = ["ts"] }
dispatch-paycom = { path = "../../collectors/paycom", features = ["ts"] }
dispatch-routes = { path = "../../features/routes", features = ["ts"] }
dispatch-uniforms = { path = "../../features/uniforms", features = ["ts"] }
base64 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
# Writes shared/contracts/generated from the response types; never part of the binary.
ts-rs = { workspace = true }

[[test]]
name = "agent_activity"
path = "../../app/tests/backend/integration/agent_activity.rs"

